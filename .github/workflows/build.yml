name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No Linux target: anyone running Linux can install from PyPI, and a
  # standalone build there costs a container with an old glibc plus a
  # verification pass on a second distribution.
  #
  # macOS is Apple Silicon only. numpy and scipy publish no universal2
  # wheels, so an Intel build needs its own runner, and those are scarce
  # enough to hold the whole run up for the better part of an hour.
  #
  # Each entry builds where it runs; PyInstaller cannot cross-compile.
  native:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows-x86_64
          - os: macos-14
            tag: macos-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install -y --no-progress ffmpeg
          else
            brew install ffmpeg
          fi

      - name: Build
        shell: bash
        run: |
          python -m venv .venv-build
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=.venv-build/Scripts/python.exe
          else
            PY=.venv-build/bin/python
          fi
          "$PY" -m pip install --quiet --upgrade pip
          "$PY" -m pip install --quiet -e ".[build]"
          "$PY" packaging/build.py

      # Verify the unpacked archive, not the build tree. build.py archives as
      # its last step, so anything done to dist/ afterwards is tested but never
      # shipped -- and archiving itself can damage what it packs. macOS is the
      # sharp case: arm64 refuses to run code whose signature does not check
      # out, and a mangled Python.framework reports itself as damaged.
      - name: Verify what will ship
        shell: bash
        run: |
          rm -rf shipped && mkdir shipped
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=.venv-build/Scripts/python.exe
            "$PY" -c "import zipfile,glob; zipfile.ZipFile(glob.glob('dist/*.zip')[0]).extractall('shipped')"
          else
            PY=.venv-build/bin/python
            # Unpack the way the archive was made, so symlinks and permissions
            # are exercised end to end.
            ditto -x -k dist/*.zip shipped
          fi
          BUNDLE=$(echo shipped/*)
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --verify --deep --strict --verbose=2 "$BUNDLE/audio-overlap-removal"
            chmod +x "$BUNDLE/audio-overlap-removal"
          fi
          "$PY" packaging/verify.py --bundle "$BUNDLE"

      # Both targets archive as zip; only the Linux path build.py still
      # supports produces a tar.gz, and nothing here runs on Linux.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tag }}
          path: dist/*.zip

  release:
    # Tagging is the publish action: Actions artifacts need a login to download
    # and expire after 90 days, so they cannot be what users are pointed at.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

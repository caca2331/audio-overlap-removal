name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No Linux target: anyone running Linux can install from PyPI, and a
  # standalone build there costs a container with an old glibc plus a
  # verification pass on a second distribution.
  #
  # Each entry builds where it runs. PyInstaller cannot cross-compile, and
  # macOS has no universal2 wheels for numpy/scipy, so each architecture
  # needs its own runner.
  native:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows-x86_64
          - os: macos-14
            tag: macos-arm64
          - os: macos-13
            tag: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install -y --no-progress ffmpeg
          else
            brew install ffmpeg
          fi

      - name: Build
        shell: bash
        run: |
          python -m venv .venv-build
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=.venv-build/Scripts/python.exe
          else
            PY=.venv-build/bin/python
          fi
          "$PY" -m pip install --quiet --upgrade pip
          "$PY" -m pip install --quiet -e ".[build]"
          "$PY" packaging/build.py

      - name: Ad-hoc sign
        if: runner.os == 'macOS'
        run: codesign -s - --force --deep "dist/${{ matrix.tag }}/audio-overlap-removal"

      - name: Verify
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv-build/Scripts/python.exe packaging/verify.py
          else
            .venv-build/bin/python packaging/verify.py
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

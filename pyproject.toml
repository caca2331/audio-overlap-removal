[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-overlap-removal"
version = "0.1.0"
description = "Remove a known, time-overlapping reference track from real-world audio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.scripts]
audio-overlap-removal = "audio_overlap_removal.cli:main"

[tool.setuptools]
packages = ["audio_overlap_removal"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
